# Host por defecto: rechaza cualquier petición cuyo Host no sea el del cliente
server {
    listen 80 default_server;
    server_name _;
    return 444;  # cierra la conexión sin responder
}

# Virtual host del cliente: Aceites del Aljarafe
server {
    listen 80;
    server_name aceitesdelaljarafe.local www.aceitesdelaljarafe.local localhost;

    # Raíz del sitio dentro del contenedor (aquí se monta ./html)
    root /usr/share/nginx/html;
    index index.html;

    # Oculta la versión de Nginx en la cabecera Server y en las páginas de error
    server_tokens off;

    # Cabeceras de seguridad ("always" las añade también en errores 403/404)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Mitigación de ataques lentos (Slowloris) y de peticiones abusivas
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    client_max_body_size  1k;   # web estática: no se aceptan subidas

    # Logs: en la imagen oficial estas rutas apuntan a stdout y stderr,
    # así que no se guarda nada dentro del contenedor y se leen
    # con "docker compose logs"
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Página principal y resto de rutas: si el archivo no existe, 404
    location / {
        limit_except GET HEAD { deny all; }   # solo lectura: GET y HEAD
        try_files $uri $uri/ =404;
    }

    # Archivos estáticos: caché corta (1 hora) para que los cambios de CSS
    # no tarden días en verse
    location ~* \.(css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1h;
    }

    # Bloquea el acceso a archivos ocultos (.git, .env, .htaccess...)
    location ~ /\. {
        deny all;
    }
}